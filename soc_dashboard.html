<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIEM Security — SOC</title>
<!--
  Página autocontenida (React + Babel vía CDN, sin build) para poder ver los
  cuatro paneles del MVP sin montar un proyecto Next.js/Vite. Los .jsx en
  src/components/ siguen siendo el código "de verdad" para cuando exista una
  app React real; esto es el harness mínimo para verlos funcionar ya.
  Se sirve desde el propio backend (GET /dashboard) para que el fetch sea
  same-origin y no dependa de la configuración de CORS.
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js';document.head.appendChild(s);})();"></script>
<style>body { margin: 0; }</style>
</head>
<body>
<div id="demo-banner" style="display:none;position:sticky;top:0;z-index:9999;background:#7c3aed;color:#fff;padding:8px 16px;font:600 13px/1.4 system-ui,sans-serif;text-align:center;">
  🧪 Estás viendo un dashboard de EJEMPLO con datos inventados —
  <a href="/demo" style="color:#fff;text-decoration:underline;">solicita una demo con datos reales</a>
</div>
<script>
  if (window.location.pathname.indexOf('/demo/dashboard') === 0) {
    document.getElementById('demo-banner').style.display = 'block';
  }
</script>
<div id="root"></div>
<script>
// Añadido 2026-09-03: todo /v1/* pasó a exigir la cabecera X-SIAM-API-Key
// (ver api_key_middleware en siem/main.py) tras descubrir el backend
// expuesto sin ninguna autenticación. Este shim pide la clave una vez por
// navegador, la guarda en localStorage y la añade automáticamente a toda
// petición fetch("/v1/...") sin tocar los fetch() existentes uno a uno. Si
// el backend responde 401 (clave ausente o incorrecta), se limpia y se
// vuelve a pedir.
//
// Añadido 2026-09-04 (dashboard de ejemplo en /demo/dashboard, ver
// siem/router/demo.py): esta misma página se sirve tal cual bajo esa ruta
// pública para un visitante anónimo, así que en ese modo las llamadas se
// reescriben hacia /demo/v1/... (una base de datos separada e inventada,
// sin AI real) y NUNCA se pide la clave -- un prospecto no la tiene.
(function () {
  var IS_DEMO = window.location.pathname.indexOf('/demo/dashboard') === 0;
  var KEY_STORAGE = 'siam_api_key';
  function getKey() {
    var k = localStorage.getItem(KEY_STORAGE);
    if (!k) {
      k = window.prompt('Clave de API de SIAM (X-SIAM-API-Key):') || '';
      if (k) localStorage.setItem(KEY_STORAGE, k);
    }
    return k;
  }
  var originalFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.indexOf('/v1/') === 0) {
      if (IS_DEMO) {
        url = '/demo' + url;
        input = url;
      } else {
        init = init || {};
        init.headers = Object.assign({}, init.headers, { 'X-SIAM-API-Key': getKey() });
      }
    }
    return originalFetch(input, init).then(function (res) {
      if (res.status === 401 && url.indexOf('/v1/') === 0 && !IS_DEMO) {
        localStorage.removeItem(KEY_STORAGE);
      }
      return res;
    });
  };
})();
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const SEVERITY_STYLE = {
  critica: 'bg-rose-950 border-rose-500 text-rose-300',
  alta: 'bg-rose-900/40 border-rose-700 text-rose-300',
  media: 'bg-amber-900/30 border-amber-700 text-amber-300',
  baja: 'bg-slate-800 border-slate-700 text-slate-300',
  info: 'bg-slate-800 border-slate-700 text-slate-400',
};
const STATUS_LABEL = { abierto: 'Abierto', en_investigacion: 'En investigación', resuelto: 'Resuelto' };

// El backend guarda datetime.utcnow() NAIVE (sin 'Z' ni offset): new Date()
// sobre ese string lo interpreta como hora LOCAL y todo salía desplazado
// (+2h en Madrid en verano). Se añade la 'Z' solo si el string no trae ya
// información de zona.
function parseUtc(iso) {
  if (!iso) return null;
  return new Date(/Z|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z');
}
function fmtDateTime(iso) {
  const d = parseUtc(iso);
  return d ? d.toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
}
// Etiqueta de una barra del gráfico de serie temporal. El backend agrega por
// hora en UTC y devuelve "AAAA-MM-DD HH:00" (naive). Sin convertir, un evento
// de las 21:59 UTC salía rotulado "21:00" mientras el reloj del usuario en
// Madrid marcaba 23:59 -> parecía que el gráfico estaba parado 2h atrás. Solo
// se convierte la granularidad "hour": día/mes/año son fechas sin hora y
// convertirlas por zona podría cruzar un límite de día sin motivo.
function fmtBucketLabel(periodo, granularity) {
  if (granularity !== 'hour') return periodo;
  const d = parseUtc(periodo.replace(' ', 'T'));
  return d ? d.toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : periodo;
}
function fmtDuration(ms) {
  if (ms == null || isNaN(ms)) return '—';
  const s = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d > 0) return `${d}d ${h % 24}h`;
  if (h > 0) return `${h}h ${m % 60}m`;
  if (m > 0) return `${m}m ${s % 60}s`;
  return `${s}s`;
}
const ROLES = [
  { value: 'direccion', label: 'Dirección' },
  { value: 'it_responsable', label: 'Responsable IT' },
  { value: 'analista', label: 'Analista' },
  { value: 'auditor', label: 'Auditor' },
  { value: 'admin', label: 'Administrador' },
  { value: 'superadmin', label: 'Superadministrador' },
];

function riskColor(score) {
  if (score >= 60) return 'text-rose-400';
  if (score >= 30) return 'text-amber-400';
  return 'text-emerald-400';
}

// ---------------------------------------------------------------------------
// Serie temporal de ataques: hora / día / mes / año. "Tiempo real" ya está
// cubierto por la tarjeta de eventos del último minuto en MonitoringPanel,
// que se refresca sola cada 4s — no hace falta un websocket para esto.
// ---------------------------------------------------------------------------
function TimeseriesChart() {
  const [granularity, setGranularity] = useState('day');
  const [buckets, setBuckets] = useState([]);
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    async function load() {
      try {
        const res = await fetch(`/v1/monitoring/timeseries?granularity=${granularity}`);
        if (res.ok && !cancelled) {
          const data = await res.json();
          setBuckets(data.buckets);
        }
      } catch (err) { console.error(err); }
    }
    load();
    const id = setInterval(load, 10000);
    return () => { cancelled = true; clearInterval(id); };
  }, [granularity]);

  useEffect(() => {
    if (!canvasRef.current || buckets.length === 0) return;
    // Bug real (2026-07-03): chart.js se carga desde un CDN externo
    // (cdnjs) que a veces responde 503. Si `Chart` no existe, esto tiraba
    // un ReferenceError sin capturar dentro de un efecto -- sin error
    // boundary, React desmontaba TODO el árbol y dejaba la página en
    // blanco, no solo este gráfico. Se degrada en vez de reventar.
    if (typeof Chart === 'undefined') return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'bar',
      data: {
        labels: buckets.map((b) => fmtBucketLabel(b.periodo, granularity)),
        datasets: [
          { label: 'Eventos', data: buckets.map((b) => b.eventos), backgroundColor: 'rgba(59,130,246,0.6)', borderRadius: 4 },
          { label: 'Críticos', data: buckets.map((b) => b.criticos), backgroundColor: 'rgba(244,63,94,0.85)', borderRadius: 4 },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#cbd5e1' } } },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
          y: { ticks: { color: '#94a3b8', precision: 0 }, grid: { color: '#1e293b' }, beginAtZero: true },
        },
      },
    });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [buckets]);

  const LABELS = { hour: 'Por hora', day: 'Por día', month: 'Por mes', year: 'Por año' };

  return (
    <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg mb-6">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h2 className="text-lg font-semibold">📈 Ataques a lo largo del tiempo</h2>
        <div className="flex gap-1">
          {Object.entries(LABELS).map(([g, label]) => (
            <button key={g} onClick={() => setGranularity(g)}
              className={`text-xs px-2 py-1 rounded border ${granularity === g ? 'bg-blue-600 border-blue-500' : 'border-slate-700 hover:bg-slate-800'}`}>
              {label}
            </button>
          ))}
        </div>
      </div>
      {typeof Chart === 'undefined' ? (
        <p className="text-amber-400 italic text-sm">No se pudo cargar Chart.js (CDN externo no disponible). Los datos siguen accesibles en <code className="text-slate-400">/v1/monitoring/timeseries</code>.</p>
      ) : buckets.length === 0 ? (
        <p className="text-slate-500 italic text-sm">Todavía no hay suficientes eventos para graficar — genera alguno abajo.</p>
      ) : (
        <div style={{ height: '260px' }}>
          <canvas ref={canvasRef}></canvas>
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Monitorización (módulo 1) — usa /v1/monitoring/overview, no /v1/metrics
// (ese es el de tickets Jira, sigue existiendo aparte en "/")
// ---------------------------------------------------------------------------
function MonitoringPanel() {
  const [overview, setOverview] = useState(null);
  const [creating, setCreating] = useState(false);
  const [eventsPageSize, setEventsPageSize] = useState(10);

  async function load() {
    try {
      const res = await fetch('/v1/monitoring/overview');
      if (res.ok) setOverview(await res.json());
    } catch (err) { console.error(err); }
  }

  useEffect(() => {
    load();
    const id = setInterval(load, 4000);
    return () => clearInterval(id);
  }, []);

  async function crearEventoDemo(severity) {
    setCreating(true);
    try {
      await fetch('/v1/monitoring/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          source: 'demo',
          asset_name: 'web-prod-01',
          event_type: 'demo',
          severity,
          summary: severity === 'critica' ? 'Ransomware detectado (demo)' : 'Evento de prueba',
        }),
      });
      await load();
    } finally { setCreating(false); }
  }

  if (!overview) return <div className="text-slate-500 italic p-6">Cargando...</div>;

  return (
    <div>
      <div className="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
          <h3 className="text-slate-400 text-sm font-medium">Riesgo global</h3>
          <p className={`text-3xl font-extrabold mt-2 ${riskColor(overview.riesgo_global)}`}>{overview.riesgo_global}/100</p>
        </div>
        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
          <h3 className="text-slate-400 text-sm font-medium">Activos monitorizados</h3>
          <p className="text-3xl font-extrabold mt-2 text-blue-400">{overview.activos_monitorizados}</p>
        </div>
        <div className={`p-4 rounded-xl border shadow-lg ${overview.alertas_abiertas > 0 ? 'bg-rose-950 border-rose-500 animate-pulse' : 'bg-slate-900 border-slate-800'}`}>
          <h3 className="text-slate-400 text-sm font-medium">Alertas abiertas</h3>
          <p className="text-3xl font-extrabold mt-2">{overview.alertas_abiertas}</p>
        </div>
        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
          <h3 className="text-slate-400 text-sm font-medium">Eventos totales</h3>
          <p className="text-3xl font-extrabold mt-2 text-emerald-400">{overview.kpis.eventos_totales}</p>
        </div>
        <div className={`p-4 rounded-xl border shadow-lg ${overview.eventos_ultimo_minuto > 0 ? 'bg-amber-950 border-amber-600' : 'bg-slate-900 border-slate-800'}`}>
          <h3 className="text-slate-400 text-sm font-medium flex items-center gap-1">
            <span className={`inline-block w-2 h-2 rounded-full ${overview.eventos_ultimo_minuto > 0 ? 'bg-amber-400 animate-pulse' : 'bg-slate-600'}`}></span>
            Tiempo real (último min.)
          </h3>
          <p className="text-3xl font-extrabold mt-2 text-amber-400">{overview.eventos_ultimo_minuto}</p>
        </div>
      </div>

      <TimeseriesChart />

      <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg mb-6">
        <h2 className="text-lg font-semibold mb-3">Generar evento de prueba</h2>
        <p className="text-xs text-slate-500 mb-3">Crea un evento sobre el activo "web-prod-01" para ver la correlación en Incidentes.</p>
        <div className="flex flex-wrap gap-2">
          {['baja', 'media', 'alta', 'critica'].map((s) => (
            <button key={s} disabled={creating} onClick={() => crearEventoDemo(s)}
              className={`text-xs px-3 py-2 rounded border font-semibold disabled:opacity-50 ${SEVERITY_STYLE[s]}`}>
              + Evento {s}
            </button>
          ))}
        </div>
      </div>

      <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg">
        <h2 className="text-lg font-semibold mb-3">Eventos recientes</h2>
        {overview.eventos_recientes.length === 0 ? (
          <p className="text-slate-500 italic text-sm">Sin eventos todavía.</p>
        ) : (
          <>
            <div className="flex items-center justify-between gap-2 mb-2 text-xs text-slate-500">
              <span>Mostrando {Math.min(eventsPageSize, overview.eventos_recientes.length)} de {overview.eventos_recientes.length}</span>
              <div className="flex gap-1">
                {[10, 50, 100].map((n) => (
                  <button key={n} onClick={() => setEventsPageSize(n)}
                    className={`px-2 py-0.5 rounded border ${eventsPageSize === n ? 'bg-blue-600 border-blue-500 text-white' : 'border-slate-700 hover:bg-slate-800'}`}>
                    {n}
                  </button>
                ))}
              </div>
            </div>
            <div className="space-y-1 font-mono text-xs max-h-64 overflow-y-auto">
              {overview.eventos_recientes.slice(0, eventsPageSize).map((e) => (
                <div key={e.id} className="border-b border-slate-900 pb-1 flex justify-between">
                  <span>{e.summary} <span className="text-slate-500">({e.asset_name || e.asset_id || 's/activo'})</span></span>
                  <span className={`px-1.5 rounded ${SEVERITY_STYLE[e.severity] || ''}`}>{e.severity}</span>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Incidentes (módulos 3 y 4)
// ---------------------------------------------------------------------------
function IncidentsPanel() {
  const [incidents, setIncidents] = useState([]);
  const [selected, setSelected] = useState(null);
  const [loading, setLoading] = useState(true);
  const [explaining, setExplaining] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [killchaining, setKillchaining] = useState(false);
  const [pageSize, setPageSize] = useState(10);
  const detailRef = useRef(null);

  // En móvil el panel de detalle cae debajo de la lista (grid de 1 columna);
  // sin este scroll, seleccionar un incidente en una lista larga parecía no
  // hacer nada hasta bajar a mano.
  useEffect(() => {
    if (selected && detailRef.current) {
      detailRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, [selected]);

  async function loadIncidents() {
    try {
      const res = await fetch('/v1/incidents');
      if (res.ok) setIncidents(await res.json());
    } catch (err) { console.error(err); } finally { setLoading(false); }
  }

  useEffect(() => {
    loadIncidents();
    const id = setInterval(loadIncidents, 5000);
    return () => clearInterval(id);
  }, []);

  async function updateStatus(id, status) {
    const res = await fetch(`/v1/incidents/${id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }),
    });
    // Sin esto, el panel de detalle se quedaba con el estado viejo hasta
    // re-seleccionar el incidente (y el botón de eliminar no aparecía nunca
    // justo después de marcarlo resuelto). El spread conserva los campos
    // solo-de-cliente (lastExplanation, aiProvider).
    if (res.ok) {
      const updated = await res.json();
      setSelected((prev) => (prev && prev.id === id ? { ...prev, ...updated } : prev));
    }
    await loadIncidents();
  }

  async function explain(id) {
    setExplaining(true);
    try {
      const res = await fetch(`/v1/incidents/${id}/explain`, { method: 'POST' });
      // Un 500 pelado no es JSON: res.json() lanzaba, y como no había catch
      // el usuario no veía absolutamente nada (bug real en producción,
      // 2026-07-16). Ahora cualquier fallo acaba en explainError, visible.
      let data = null;
      try { data = await res.json(); } catch (e) { /* respuesta no-JSON */ }
      if (res.ok && data) {
        setSelected((prev) => (prev && prev.id === id ? { ...prev, lastExplanation: data.explicacion, aiProvider: data.proveedor_ia, explainError: null } : prev));
      } else {
        const detail = (data && data.detail) || `El servidor devolvió HTTP ${res.status}.`;
        setSelected((prev) => (prev && prev.id === id ? { ...prev, explainError: detail } : prev));
      }
    } catch (err) {
      setSelected((prev) => (prev && prev.id === id ? { ...prev, explainError: 'No se pudo contactar con el servidor: ' + err.message } : prev));
    } finally { setExplaining(false); }
  }

  async function reconstructKillChain(id) {
    setKillchaining(true);
    try {
      const res = await fetch(`/v1/incidents/${id}/kill-chain`, { method: 'POST' });
      // Mismo blindaje que explain(): un 500/502 puede no ser JSON, así que
      // se envuelve el parseo y cualquier fallo acaba en killError visible.
      let data = null;
      try { data = await res.json(); } catch (e) { /* respuesta no-JSON */ }
      if (res.ok && data) {
        setSelected((prev) => (prev && prev.id === id ? { ...prev, killChain: data.kill_chain, killNarrative: data.narrativa, aiProvider: data.proveedor_ia, killError: null } : prev));
        await loadIncidents();  // el endpoint deja rastro en la línea temporal
      } else {
        const detail = (data && data.detail) || `El servidor devolvió HTTP ${res.status}.`;
        setSelected((prev) => (prev && prev.id === id ? { ...prev, killError: detail } : prev));
      }
    } catch (err) {
      setSelected((prev) => (prev && prev.id === id ? { ...prev, killError: 'No se pudo contactar con el servidor: ' + err.message } : prev));
    } finally { setKillchaining(false); }
  }

  async function removeIncident(id) {
    if (!window.confirm('¿Eliminar definitivamente este incidente resuelto? Esta acción no se puede deshacer.')) return;
    setDeleting(true);
    try {
      const res = await fetch(`/v1/incidents/${id}`, { method: 'DELETE' });
      if (res.ok) {
        setSelected(null);
        await loadIncidents();
      } else {
        let data = null;
        try { data = await res.json(); } catch (e) { /* respuesta no-JSON */ }
        window.alert((data && data.detail) || `No se pudo eliminar el incidente (HTTP ${res.status}).`);
      }
    } finally { setDeleting(false); }
  }

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 bg-slate-900 rounded-xl border border-slate-800 shadow-lg overflow-hidden">
        {/* En móvil la fila se apila en tarjeta (sin scroll lateral); a partir de sm: vuelve a grid de 5 columnas */}
        <div className="hidden sm:grid sm:grid-cols-5 gap-2 text-xs font-bold text-slate-500 border-b border-slate-800 px-4 py-2 items-center">
          <div className="col-span-2">Incidente</div><div>Severidad</div><div>Estado</div><div>Riesgo</div>
        </div>
        {!loading && incidents.length > 0 && (
          <div className="flex items-center justify-between gap-2 px-4 py-2 text-xs text-slate-500 border-b border-slate-900">
            <span>Mostrando {Math.min(pageSize, incidents.length)} de {incidents.length}</span>
            <div className="flex gap-1">
              {[10, 50, 100].map((n) => (
                <button key={n} onClick={() => setPageSize(n)}
                  className={`px-2 py-0.5 rounded border ${pageSize === n ? 'bg-blue-600 border-blue-500 text-white' : 'border-slate-700 hover:bg-slate-800'}`}>
                  {n}
                </button>
              ))}
            </div>
          </div>
        )}
        {loading ? (
          <div className="p-4 text-slate-500 italic">Cargando...</div>
        ) : incidents.length === 0 ? (
          <div className="p-4 text-slate-500 italic">Sin incidentes todavía — genera un evento en Monitorización.</div>
        ) : (
          incidents.slice(0, pageSize).map((inc) => (
            <button key={inc.id} onClick={() => setSelected(inc)}
              className={`w-full text-left flex flex-col gap-2 sm:grid sm:grid-cols-5 sm:gap-2 sm:items-center px-4 py-3 border-b border-slate-900 hover:bg-slate-800/60 ${selected && selected.id === inc.id ? 'bg-slate-800/80' : ''}`}>
              <div className="sm:col-span-2 truncate">
                <div className="font-semibold truncate">{inc.title}</div>
                <div className="text-xs text-slate-500">{inc.id} · {fmtDateTime(inc.created_at)}</div>
              </div>
              <div className="flex flex-wrap items-center gap-2 sm:contents">
                <span className={`px-2 py-0.5 rounded text-[10px] border ${SEVERITY_STYLE[inc.severity] || SEVERITY_STYLE.info}`}>{inc.severity}</span>
                <div className="text-xs text-slate-400">
                  {STATUS_LABEL[inc.status] || inc.status}
                  {inc.resolved_at && (
                    <div className="text-[10px] text-emerald-500">⏱ {fmtDuration(parseUtc(inc.resolved_at) - parseUtc(inc.created_at))}</div>
                  )}

function AIChatPanel() {
  const [role, setRole] = useState('analista');
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [sending, setSending] = useState(false);
  const [provider, setProvider] = useState(null);

  async function send() {
    if (!input.trim() || sending) return;
    const userMessage = { role: 'user', content: input };
    const history = messages;
    setMessages((prev) => [...prev, userMessage]);
    setInput('');
    setSending(true);
    try {
      const res = await fetch('/v1/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: userMessage.content, user_role: role, history }),
      });
      const data = await res.json();
      setProvider(data.proveedor_ia);
      setMessages((prev) => [...prev, { role: 'assistant', content: data.respuesta }]);
    } catch (err) {
      setMessages((prev) => [...prev, { role: 'assistant', content: 'Error al contactar con el motor de IA.' }]);
    } finally { setSending(false); }
  }

  return (
    <div className="flex flex-col h-[70vh]">
      <div className="mb-4 flex items-center justify-between">
        <p className="text-sm text-slate-400">{provider ? `Proveedor activo: ${provider}` : 'El nivel de detalle se adapta al rol seleccionado'}</p>
        <select value={role} onChange={(e) => setRole(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
          {ROLES.map((r) => <option key={r.value} value={r.value}>{r.label}</option>)}
        </select>
      </div>
      <div className="flex-1 bg-slate-900 border border-slate-800 rounded-xl p-4 overflow-y-auto space-y-3 mb-4">
        {messages.length === 0 && <p className="text-slate-500 italic text-sm">Prueba: "¿qué significa esta alerta?", "¿qué prioridad tiene?", "¿cómo reducir este riesgo?"</p>}
        {messages.map((m, idx) => (
          <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
            <div className={`max-w-[75%] rounded-lg px-3 py-2 text-sm whitespace-pre-line ${m.role === 'user' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200'}`}>{m.content}</div>
          </div>
        ))}
        {sending && <div className="text-slate-500 text-xs italic">Pensando...</div>}
      </div>
      <div className="flex gap-2">
        <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()}
          placeholder="Escribe tu pregunta..." className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
        <button onClick={send} disabled={sending} className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 px-4 py-2 rounded text-sm font-semibold">Enviar</button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Simulador de crisis: practicar sobre el mismo motor de correlación que un
// incidente real, con delays de verdad entre eventos (siam/scenarios.py +
// siam/simulator.py). Lo que genera esto no es un mock: son eventos e
// incidentes reales en el mismo siam.db, visibles también en Incidentes.
// ---------------------------------------------------------------------------
function SimulatorPanel() {
  const [scenarios, setScenarios] = useState([]);
  const [selected, setSelected] = useState(null);
  const [run, setRun] = useState(null);
  const [launching, setLaunching] = useState(false);
  const pollRef = useRef(null);

  useEffect(() => {
    async function load() {
      try {
        const res = await fetch('/v1/monitoring/scenarios');
        if (res.ok) {
          const data = await res.json();
          setScenarios(data);
          if (data.length > 0) setSelected(data[0].id);
        }
      } catch (err) { console.error(err); }
    }
    load();
    return () => { if (pollRef.current) clearInterval(pollRef.current); };
  }, []);

  async function launch() {
    if (!selected || launching || (run && run.status === 'en_curso')) return;
    setLaunching(true);
    setRun(null);
    try {
      const res = await fetch(`/v1/monitoring/simulate/${selected}`, { method: 'POST' });
      if (!res.ok) throw new Error('No se pudo lanzar el escenario');
      const data = await res.json();
      setRun(data);
      if (pollRef.current) clearInterval(pollRef.current);
      pollRef.current = setInterval(async () => {
        const statusRes = await fetch(`/v1/monitoring/simulate/${data.run_id}/status`);
        if (statusRes.ok) {
          const statusData = await statusRes.json();
          setRun(statusData);
          if (statusData.status !== 'en_curso') clearInterval(pollRef.current);
        }
      }, 1500);
    } catch (err) {
      console.error(err);
    } finally {
      setLaunching(false);
    }
  }

  const enCurso = run && run.status === 'en_curso';

  return (
    <div>
      <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg mb-6">
        <h2 className="text-lg font-semibold mb-1">🧪 Simulador de crisis</h2>
        <p className="text-xs text-slate-500 mb-4">
          Practica sobre el mismo motor de correlación que un incidente real: los eventos e
          incidentes que genera esto se guardan igual que cualquier otro, con delays reales entre pasos.
        </p>
        {scenarios.length === 0 ? (
          <p className="text-slate-500 italic text-sm">Cargando escenarios...</p>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
            {scenarios.map((s) => (
              <button key={s.id} disabled={enCurso} onClick={() => setSelected(s.id)}
                className={`text-left p-3 rounded-lg border transition disabled:opacity-50 ${selected === s.id ? 'bg-blue-950 border-blue-500' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`}>
                <div className="font-semibold text-sm">{s.name}</div>
                <div className="text-xs text-slate-500 mt-1">{s.description}</div>
                <div className="text-[10px] text-slate-600 mt-2">{s.total_steps} pasos</div>
              </button>
            ))}
          </div>
        )}
        <button onClick={launch} disabled={!selected || launching || enCurso}
          className="bg-rose-700 hover:bg-rose-600 disabled:opacity-50 rounded px-4 py-2 text-sm font-semibold">
          {enCurso ? '⏳ Escenario en curso...' : '▶️ Lanzar escenario'}
        </button>
      </div>

      {run && (
        <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-lg font-semibold">{run.scenario_name}</h2>
            <span className={`text-xs px-2 py-1 rounded border ${
              run.status === 'completado' ? 'bg-emerald-950 border-emerald-600 text-emerald-300' :
              run.status === 'error' ? 'bg-rose-950 border-rose-600 text-rose-300' :
              'bg-amber-950 border-amber-600 text-amber-300 animate-pulse'
            }`}>{run.status}</span>
          </div>
          <div className="w-full bg-slate-950 rounded-full h-2 mb-4 overflow-hidden">
            <div className="bg-blue-600 h-2 transition-all" style={{ width: `${(run.completed_steps / run.total_steps) * 100}%` }}></div>
          </div>
          <p className="text-xs text-slate-500 mb-2">{run.completed_steps}/{run.total_steps} eventos inyectados</p>
          <div className="space-y-1 font-mono text-xs max-h-64 overflow-y-auto">
            {run.log.length === 0 ? (
              <p className="text-slate-500 italic">Esperando el primer evento...</p>
            ) : (
              run.log.map((entry, idx) => (
                <div key={idx} className="border-b border-slate-950 pb-1 flex justify-between">
                  <span>
                    <span className="text-slate-500">{new Date(entry.timestamp).toLocaleTimeString()}</span>{' '}
                    {entry.summary || entry.error} <span className="text-slate-600">({entry.asset_name || 's/activo'})</span>
                  </span>
                  <span className={`px-1.5 rounded ${SEVERITY_STYLE[entry.severity] || ''}`}>{entry.severity || 'error'}</span>
                </div>
              ))
            )}
          </div>
          {run.status === 'completado' && (
            <p className="text-xs text-emerald-400 mt-3">✅ Escenario completado — revisa la pestaña Incidentes para ver la correlación en acción.</p>
          )}
        </div>
      )}
    </div>
  );
}

function CampaignsPanel() {
  const [view, setView] = useState('list');
  const [campaigns, setCampaigns] = useState([]);
  const [selected, setSelected] = useState(null);
  const [metrics, setMetrics] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: '', topic: 'phishing', content_type: 'email_phishing', targetsText: '', starts_at: '' });
  const [busy, setBusy] = useState(false);
  const [sendResult, setSendResult] = useState(null);

  async function loadCampaigns() {
    const res = await fetch('/v1/campaigns');
    if (res.ok) setCampaigns(await res.json());
  }

  useEffect(() => {
    loadCampaigns();
    const id = setInterval(loadCampaigns, 8000);
    return () => clearInterval(id);
  }, []);

  async function loadMetrics(id) {
    const res = await fetch(`/v1/campaigns/${id}/metrics`);
    if (res.ok) setMetrics(await res.json());
  }

  async function selectCampaign(c) {
    setSelected(c);
    setSendResult(null);
    await loadMetrics(c.id);
  }

  async function refreshSelected(id) {
    const res = await fetch(`/v1/campaigns/${id}`);
    if (res.ok) {
      const data = await res.json();
      setSelected(data);
      await loadMetrics(data.id);
    }
    await loadCampaigns();
  }

  function parseTargets(text) {
    return text.split('\n').map((line) => line.trim()).filter(Boolean).map((line) => {
      const [name, email, department] = line.split(',').map((p) => (p || '').trim());
      return { name: name || email || 'Sin nombre', email: email || null, department: department || null };
    });
  }

  async function createCampaign() {
    if (!form.name.trim()) return;
    setBusy(true);
    try {
      const res = await fetch('/v1/campaigns', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: form.name,
          topic: form.topic,
          content_type: form.content_type,
          targets: parseTargets(form.targetsText),
          starts_at: form.starts_at ? new Date(form.starts_at).toISOString() : null,
        }),
      });
      if (res.ok) {
        setForm({ name: '', topic: 'phishing', content_type: 'email_phishing', targetsText: '', starts_at: '' });
        setShowForm(false);
        await loadCampaigns();
      }
    } finally { setBusy(false); }
  }

  async function generateContent() {
    if (!selected) return;
    setBusy(true);
    try {
      await fetch(`/v1/campaigns/${selected.id}/generate-content`, { method: 'POST' });
      await refreshSelected(selected.id);
    } finally { setBusy(false); }
  }

  async function sendCampaign() {
    if (!selected) return;
    setBusy(true);
    setSendResult(null);
    try {
      const res = await fetch(`/v1/campaigns/${selected.id}/send`, { method: 'POST' });
      const data = await res.json();
      setSendResult(data);
      await refreshSelected(selected.id);
    } finally { setBusy(false); }
  }

  async function validateTarget(targetId) {
    const validatedBy = window.prompt('¿Quién del equipo de seguridad valida esta lectura?');
    if (!validatedBy) return;
    await fetch(`/v1/campaigns/${selected.id}/targets/${targetId}/validate`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ validated_by: validatedBy }),
    });
    await refreshSelected(selected.id);
  }

  async function deleteCampaign(campaign) {
    const aviso = campaign.status === 'borrador'

// ---------------------------------------------------------------------------
// Analítica cruzada entre campañas: quién repite haciendo clic (el
// indicador de riesgo real), y si la tasa de clic mejora campaña a
// campaña. Es el dato que un SOC de correlación de eventos genérico no
// tiene -- el histórico por persona, no solo por incidente.
// ---------------------------------------------------------------------------
function CampaignAnalytics() {
  const [data, setData] = useState(null);
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    async function load() {
      try {
        const res = await fetch('/v1/campaigns/analytics');
        if (res.ok && !cancelled) setData(await res.json());
      } catch (err) { console.error(err); }
    }
    load();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (!data || !canvasRef.current || data.tendencia.length === 0) return;
    if (typeof Chart === 'undefined') return; // mismo guard que TimeseriesChart -- CDN externo puede fallar
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'line',
      data: {
        labels: data.tendencia.map((t) => t.name),
        datasets: [
          { label: 'Tasa de clic %', data: data.tendencia.map((t) => t.tasa_clic), borderColor: 'rgba(244,63,94,0.9)', backgroundColor: 'rgba(244,63,94,0.2)', tension: 0.3 },
          { label: 'Tasa de reporte %', data: data.tendencia.map((t) => t.tasa_reporte), borderColor: 'rgba(16,185,129,0.9)', backgroundColor: 'rgba(16,185,129,0.2)', tension: 0.3 },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#cbd5e1' } } },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
          y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' }, beginAtZero: true, max: 100 },
        },
      },
    });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [data]);

  if (!data) return <div className="text-slate-500 italic p-6">Cargando...</div>;

  if (data.total_campanas === 0) {
    return (
      <div className="bg-slate-900 rounded-xl border border-slate-800 shadow-lg p-6">
        <p className="text-slate-500 italic text-sm">Todavía no hay campañas enviadas — la analítica cruzada aparece en cuanto haya al menos una campaña activa o finalizada.</p>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg">
        <h2 className="text-lg font-semibold mb-3">📈 Tendencia entre campañas</h2>
        {typeof Chart === 'undefined' ? (
          <p className="text-amber-400 italic text-sm">No se pudo cargar Chart.js (CDN externo no disponible). Los datos siguen accesibles en <code className="text-slate-400">/v1/campaigns/analytics</code>.</p>
        ) : (
          <div style={{ height: '260px' }}><canvas ref={canvasRef}></canvas></div>
        )}
      </div>

      <div className="bg-slate-900 rounded-xl border border-slate-800 shadow-lg p-4">
        <h2 className="text-lg font-semibold mb-3">🏢 Por departamento (acumulado)</h2>
        <div className="grid grid-cols-3 gap-2 text-xs font-bold text-slate-500 border-b border-slate-800 pb-2 mb-2">
          <div>Departamento</div><div>Destinatarios</div><div>Tasa de clic</div>
        </div>
        {Object.entries(data.por_departamento).map(([dep, stats]) => (
          <div key={dep} className="grid grid-cols-3 gap-2 text-sm py-1.5 border-b border-slate-900">
            <div className="capitalize">{dep.replace(/_/g, ' ')}</div>
            <div>{stats.total_destinatarios}</div>
            <div className={stats.tasa_clic > 30 ? 'text-rose-400 font-semibold' : ''}>{stats.tasa_clic}%</div>
          </div>
        ))}
      </div>

      <div className="bg-slate-900 rounded-xl border border-slate-800 shadow-lg p-4">
        <h2 className="text-lg font-semibold mb-1">⚠️ Reincidentes</h2>
        <p className="text-xs text-slate-500 mb-3">Personas que han hecho clic en más de una campaña de phishing simulado — el indicador de riesgo más útil de todo esto.</p>
        {data.reincidentes.length === 0 ? (
          <p className="text-slate-500 italic text-sm">Nadie ha hecho clic todavía en más de una campaña. Buena señal.</p>
        ) : (
          <div className="space-y-1">
            {data.reincidentes.map((p) => (
              <div key={p.email} className="flex justify-between items-center text-sm border-b border-slate-900 py-1.5">
                <div>
                  <div className="font-semibold">{p.name}</div>
                  <div className="text-xs text-slate-500">{p.email}</div>
                </div>
                <div className={`text-xs px-2 py-1 rounded border font-semibold ${p.clics > 1 ? 'bg-rose-950 border-rose-600 text-rose-300' : 'bg-amber-950 border-amber-700 text-amber-300'}`}>
                  {p.clics}/{p.campanas_recibidas} clics
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Bug real (2026-07-03): un ReferenceError sin capturar en un useEffect
// (chart.js cargado desde un CDN externo que devolvió 503) tumbaba TODO el
// árbol de React y dejaba la página en blanco -- sin forma de saber por qué
// ni de recuperarse sin recargar. Este boundary envuelve cada pestaña por
// separado: si una falla, las demás siguen usables y se ve el error real.
// ---------------------------------------------------------------------------
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error('SIEM dashboard error:', error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div className="bg-rose-950/40 border border-rose-800 rounded-xl p-6 text-sm">
          <p className="font-semibold text-rose-300 mb-1">⚠️ Esta pestaña falló al cargar</p>
          <p className="text-rose-400/80 font-mono text-xs mb-3">{String(this.state.error.message || this.state.error)}</p>
          <button onClick={() => this.setState({ error: null })}
            className="bg-rose-800 hover:bg-rose-700 rounded px-3 py-1.5 text-xs font-semibold">Reintentar</button>
        </div>
      );
    }
    return this.props.children;
  }
}

    <PymeCard title="🔍 Auditoría ISO 27001 / RGPD — 15 Controles Clave">
      {error && (
        <div className="mb-4 bg-rose-900/30 border border-rose-600 rounded-lg p-3 text-sm text-rose-300">⚠️ {error}</div>
      )}
      {!loaded ? <p className="text-slate-400 text-sm">Cargando controles...</p> : checklist.length === 0 ? null : (
        <>
          <div className="mb-5">
            <div className="flex justify-between text-xs text-slate-400 mb-1"><span>Progreso</span><span className="font-bold text-white">{cumplidos} / {checklist.length}</span></div>
            <div className="h-2.5 bg-slate-700 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-violet-600 to-emerald-500 transition-all duration-500 rounded-full" style={{width:`${(cumplidos/checklist.length)*100}%`}} />
            </div>
          </div>
          <div className="space-y-4 mb-6 max-h-96 overflow-y-auto pr-1">
            {categorias.map(cat => (
              <div key={cat}>
                <p className="text-xs font-bold text-violet-400 mb-2 uppercase tracking-wide">{cat}</p>
                {checklist.filter(c => c.categoria === cat).map(control => (
                  <label key={control.id} className="flex items-start gap-3 cursor-pointer mb-2 group">
                    <input type="checkbox" className="mt-0.5 accent-emerald-500 shrink-0" checked={!!answers[control.id]} onChange={e => setAnswers(a => ({...a, [control.id]: e.target.checked}))} />
                    <span className={`text-xs leading-relaxed transition-colors ${answers[control.id] ? "text-emerald-300 line-through decoration-emerald-700" : "text-slate-300 group-hover:text-white"}`}>{control.titulo}</span>
                  </label>
                ))}
              </div>
            ))}
          </div>
          <div className="flex gap-3">
            <button id="audit-evaluate-btn" onClick={evaluate} className="px-5 py-2 bg-violet-600 hover:bg-violet-500 rounded-lg text-sm font-semibold transition-colors">📊 Evaluar Madurez</button>
            <button onClick={() => { setAnswers({}); setResult(null); }} className="px-4 py-2 border border-slate-600 hover:bg-slate-700 rounded-lg text-sm transition-colors text-slate-400">Limpiar</button>
            <button onClick={() => setAnswers(Object.fromEntries(checklist.map(c => [c.id, true])))} className="px-4 py-2 border border-emerald-700 hover:bg-emerald-900/30 rounded-lg text-sm transition-colors text-emerald-400">Marcar todo ✓</button>
          </div>
          {result && (
            <div className="mt-5 grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className={`rounded-xl p-5 border text-center ${result.color_badge === "emerald" ? "bg-emerald-900/30 border-emerald-600" : result.color_badge === "amber" ? "bg-amber-900/30 border-amber-600" : "bg-rose-900/30 border-rose-600"}`}>
                <div className="text-5xl font-black mb-1" style={{color: MATURITY_COLORS[result.color_badge]}}>{result.porcentaje_cumplimiento}%</div>
                <p className="text-xs font-semibold text-white mb-2">{result.nivel_madurez}</p>
                <p className="text-xs text-slate-400">{result.cumplidos} de {result.total_controles} controles cumplidos</p>
              </div>
              {result.puntos_mejora_prioritarios.length > 0 && (
                <div>
                  <p className="text-xs font-semibold text-amber-400 mb-2">⚡ Puntos de mejora prioritarios</p>
                  <ul className="space-y-1.5">
                    {result.puntos_mejora_prioritarios.map((p, i) => (
                      <li key={i} className="flex items-start gap-2 text-xs text-slate-300"><span className="text-amber-500 shrink-0">{i+1}.</span>{p}</li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          )}
        </>
      )}
    </PymeCard>
  );
}

const RESPONSE_ACTION_LABEL = { BLOCK: 'Bloquear', RATE_LIMIT: 'Limitar tráfico', CHALLENGE: 'Retar (CAPTCHA)', HONEYPOT: 'Honeypot' };
const STATUS_STYLE = {
  bloqueada: 'bg-emerald-950 text-emerald-300 border border-emerald-800',
  lista_blanca: 'bg-slate-800 text-slate-300 border border-slate-700',
  activa: 'bg-rose-950 text-rose-300 border border-rose-800',
};
const ATTACKER_STATUS_LABEL = { bloqueada: '● Bloqueada', lista_blanca: '○ Lista blanca', activa: '● Activa' };

function ActiveDefensePanel() {
  const [overview, setOverview] = useState(null);
  const [eventLimit, setEventLimit] = useState(10);
  const [responding, setResponding] = useState(null); // ip en curso, para desactivar botones
  const [expanded, setExpanded] = useState(null); // ip con detalle de huella abierto
  const [whitelist, setWhitelist] = useState([]);
  const [blacklist, setBlacklist] = useState([]);
  const [newWlIp, setNewWlIp] = useState('');
  const [newWlReason, setNewWlReason] = useState('');

  async function load() {
    try {
      const res = await fetch(`/v1/active-defense/overview?event_limit=${eventLimit}`);
      if (res.ok) setOverview(await res.json());
    } catch (err) { console.error(err); }
  }

  async function loadLists() {
    try {
      const [wl, bl] = await Promise.all([
        fetch('/v1/active-defense/whitelist'),
        fetch('/v1/active-defense/blacklist'),
      ]);
      if (wl.ok) setWhitelist(await wl.json());
      if (bl.ok) setBlacklist(await bl.json());
    } catch (err) { console.error(err); }
  }

  useEffect(() => {
    load();
    loadLists();
    const id = setInterval(load, 5000);
    return () => clearInterval(id);
  }, [eventLimit]);

  async function responder(ip, action) {
    if (!window.confirm(`¿Ejecutar "${RESPONSE_ACTION_LABEL[action]}" sobre ${ip}? Esta acción queda registrada como IOC confirmado.`)) return;
    setResponding(ip);
    try {
      const res = await fetch(`/v1/active-defense/respond?ip=${encodeURIComponent(ip)}&action=${action}&confirm=true`, { method: 'POST' });
      if (!res.ok) { const body = await res.json().catch(() => ({})); window.alert(body.detail || 'No se pudo ejecutar la acción.'); }
      await Promise.all([load(), loadLists()]);
    } finally { setResponding(null); }
  }

  async function addWhitelist(e) {
    e.preventDefault();
    if (!newWlIp.trim()) return;
    await fetch('/v1/active-defense/whitelist', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip: newWlIp.trim(), reason: newWlReason.trim() || null }),
    });
    setNewWlIp(''); setNewWlReason('');
    await loadLists();
  }

  async function removeWhitelist(id) {
    await fetch(`/v1/active-defense/whitelist/${id}`, { method: 'DELETE' });
    await loadLists();
  }

  async function removeBlacklist(id) {
    await fetch(`/v1/active-defense/blacklist/${id}`, { method: 'DELETE' });
    await Promise.all([load(), loadLists()]);
  }

  if (!overview) return <div className="text-slate-500 italic p-6">Cargando...</div>;

  return (
    <div>
      <div className="bg-blue-950 border border-blue-800 text-blue-200 text-xs rounded-lg px-4 py-2 mb-6">
        ⚔️ Módulo premium — Response Engine sobre el WAAP híbrido (Cloudflare + Coraza). BLOCK/CHALLENGE/HONEYPOT se ejecutan de verdad en Cloudflare si hay token configurado: BLOCK/CHALLENGE crean una IP Access Rule por IP; HONEYPOT actualiza una regla compartida por zona que redirige al atacante a un panel señuelo del propio SIAM. RATE LIMIT se queda simulado: el plan actual de Cloudflare no permite filtrar una regla de rate limiting por IP (hace falta plan Business o superior). En todos los casos, cada acción confirmada queda registrada como IOC (lista negra) y se refleja aquí como "Bloqueada".
      </div>

      <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
          <h3 className="text-slate-400 text-sm font-medium">Threat score</h3>
          <p className={`text-3xl font-extrabold mt-2 ${riskColor(overview.threat_score)}`}>{overview.threat_score}/100</p>
        </div>
        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
          <h3 className="text-slate-400 text-sm font-medium">Atacantes activos</h3>
          <p className="text-3xl font-extrabold mt-2 text-blue-400">{overview.attackers.length}</p>
        </div>
        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
          <h3 className="text-slate-400 text-sm font-medium">Campañas correlacionadas</h3>
          <p className="text-3xl font-extrabold mt-2 text-amber-400">{overview.campaigns.length}</p>
        </div>
        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
          <h3 className="text-slate-400 text-sm font-medium">Ataques en vivo</h3>
          <p className="text-3xl font-extrabold mt-2 text-rose-400">{overview.live_attacks.length}</p>
        </div>
      </div>

      <div className="bg-slate-900 rounded-xl border border-slate-800 shadow-lg overflow-hidden mb-6">
        <div className="flex flex-wrap items-center justify-between gap-3 p-4 border-b border-slate-800">
          <h2 className="text-lg font-semibold">Eventos WAF recientes</h2>
          <label className="flex items-center gap-2 text-xs text-slate-400">
            Ver
            <select value={eventLimit} onChange={(e) => setEventLimit(Number(e.target.value))}
              className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200">
              <option value={10}>10 eventos</option>
              <option value={50}>50 eventos</option>
              <option value={100}>100 eventos</option>
            </select>
          </label>
        </div>
        <div className="max-h-80 overflow-y-auto divide-y divide-slate-800">
          {overview.live_attacks.length === 0 ? (
            <p className="p-4 text-slate-500 italic text-sm">Sin eventos WAF recientes.</p>
          ) : overview.live_attacks.map((event) => (
            <div key={event.id} className="grid grid-cols-1 sm:grid-cols-4 gap-2 px-4 py-2 text-xs">
              <span className="font-mono text-slate-300">{event.raw_payload?.client_ip || '—'}</span>
              <span className="text-slate-400 truncate">{event.summary}</span>
              <span className="text-slate-500 truncate">{event.raw_payload?.attack_category || '—'}</span>
              <span className={`sm:text-right ${SEVERITY_STYLE[event.severity] || 'text-slate-400'}`}>{event.severity}</span>
            </div>
          ))}
        </div>
      </div>

      {overview.attackers.length === 0 ? (
        <p className="text-slate-500 italic text-sm bg-slate-900 p-5 rounded-xl border border-slate-800">
          Sin ataques detectados todavía. Este módulo se alimenta del WAAP (Cloudflare/Coraza) — genera tráfico malicioso real o simulado contra el WAF para ver atacantes aquí.
        </p>
      ) : (
        <>
          <div className="bg-slate-900 rounded-xl border border-slate-800 shadow-lg overflow-hidden mb-6">
            <h2 className="text-lg font-semibold p-4 pb-0">Atacantes</h2>
            <div className="hidden sm:grid sm:grid-cols-7 gap-2 text-xs font-bold text-slate-500 border-b border-slate-800 px-4 py-2 mt-3 items-center">
              <div>IP</div><div>País / ASN</div><div>Eventos</div><div>Severidad</div><div>Estado</div><div>Sugerido</div><div>Acción</div>
            </div>
            <div className="max-h-[32rem] overflow-y-auto">
            {overview.attackers.map((a) => {
              const isWhitelisted = a.status === 'lista_blanca';
              const blockedEntry = blacklist.find((entry) => entry.value === a.ip);
              const isOpen = expanded === a.ip;
              return (
              <div key={a.ip} className="border-b border-slate-900">
                <div className="flex flex-col gap-2 sm:grid sm:grid-cols-7 sm:gap-2 sm:items-center px-4 py-3 text-sm">
                  <button className="font-mono text-left hover:underline decoration-dotted" onClick={() => setExpanded(isOpen ? null : a.ip)} title="Ver huella del atacante">
                    {a.ip}
                  </button>
                  <div className="text-slate-400 text-xs">{a.country || '—'} {a.asn ? `· ${a.asn}` : ''}</div>
                  <div>{a.event_count}</div>
                  <div><span className={`px-1.5 py-0.5 rounded text-xs ${SEVERITY_STYLE[a.max_severity] || ''}`}>{a.max_severity}</span></div>
                  <div><span className={`px-1.5 py-0.5 rounded text-xs whitespace-nowrap ${STATUS_STYLE[a.status] || ''}`}>{ATTACKER_STATUS_LABEL[a.status] || a.status}</span></div>
                  <div className="text-xs text-slate-400">{RESPONSE_ACTION_LABEL[a.suggested_action]}</div>
                  <div className="flex flex-wrap gap-1">
                    {a.status === 'bloqueada' && blockedEntry ? (
                      <button onClick={() => removeBlacklist(blockedEntry.id)}
                        className="text-xs px-2 py-1 rounded border border-emerald-700 text-emerald-300 hover:bg-emerald-900/40">
                        Desbloquear
                      </button>
                    ) : isWhitelisted ? (
                      <span className="text-xs text-slate-500 italic">en lista blanca</span>
                    ) : ['BLOCK', 'RATE_LIMIT', 'CHALLENGE', 'HONEYPOT'].map((action) => (
                      <button key={action} disabled={responding === a.ip} onClick={() => responder(a.ip, action)}
                        className={`text-xs px-2 py-1 rounded border disabled:opacity-50 ${action === a.suggested_action ? 'bg-blue-600 border-blue-500 text-white' : 'border-slate-700 hover:bg-slate-800'}`}>
                        {RESPONSE_ACTION_LABEL[action]}
                      </button>
                    ))}
                  </div>
                </div>
                {isOpen && (
                  <div className="mx-4 mb-3 p-3 rounded-lg bg-slate-950 border border-slate-800 text-xs grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-1 text-slate-300">
                    <div><span className="text-slate-500">Host / ruta atacada:</span> {a.last_host || '—'} {a.last_uri || ''}</div>
                    <div><span className="text-slate-500">Organización ASN:</span> {a.asn_org || '—'}</div>
                    <div><span className="text-slate-500">User-Agent:</span> {a.last_user_agent || '—'}</div>
                    <div><span className="text-slate-500">Referer:</span> {a.referer_host || '—'}</div>
                  </div>
                )}
              </div>
            );})}
            </div>
          </div>

          <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg mb-6">
            <h2 className="text-lg font-semibold mb-3">Lista blanca (IPs que nunca se bloquean)</h2>
            <form onSubmit={addWhitelist} className="flex flex-col sm:flex-row gap-2 mb-3">
              <input value={newWlIp} onChange={(e) => setNewWlIp(e.target.value)} placeholder="IP (p.ej. 1.2.3.4)"
                className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm flex-1" />
              <input value={newWlReason} onChange={(e) => setNewWlReason(e.target.value)} placeholder="Motivo (opcional)"
                className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm flex-1" />
              <button type="submit" className="text-sm px-3 py-1 rounded bg-blue-600 hover:bg-blue-500">Añadir</button>
            </form>
            {whitelist.length === 0 ? (
              <p className="text-slate-500 italic text-xs">Sin IPs en lista blanca.</p>
            ) : (
              <div className="space-y-1">
                {whitelist.map((w) => (
                  <div key={w.id} className="flex justify-between items-center text-sm border-b border-slate-900 pb-1">
                    <span className="font-mono">{w.ip} <span className="text-slate-500 text-xs">{w.reason ? `— ${w.reason}` : ''}</span></span>
                    <button onClick={() => removeWhitelist(w.id)} className="text-xs text-rose-400 hover:text-rose-300">Quitar</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {blacklist.length > 0 && (
            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg mb-6">
              <h2 className="text-lg font-semibold mb-3">Lista negra (bloqueadas confirmadas)</h2>
              <div className="space-y-1">
                {blacklist.map((b) => (
                  <div key={b.id} className="flex justify-between items-center text-sm border-b border-slate-900 pb-1">
                    <span className="font-mono">{b.value} <span className="text-slate-500 text-xs">{b.campaign ? `— ${b.campaign}` : ''}</span></span>
                    <button onClick={() => removeBlacklist(b.id)} className="text-xs text-rose-400 hover:text-rose-300">Desbloquear</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {overview.campaigns.length > 0 && (
            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg mb-6">
              <h2 className="text-lg font-semibold mb-3">Campañas</h2>
              <div className="space-y-2">
                {overview.campaigns.map((c) => (
                  <div key={c.name} className="flex justify-between items-center text-sm border-b border-slate-900 pb-2">
                    <span>{c.name} <span className="text-slate-500 text-xs">({c.attacker_count} atacantes, {c.event_count} eventos)</span></span>
                    <span className={`font-bold ${riskColor(c.threat_score)}`}>{c.threat_score}/100</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg">
            <h2 className="text-lg font-semibold mb-3">Timeline</h2>
            <div className="space-y-1 font-mono text-xs max-h-64 overflow-y-auto">
              {overview.timeline.slice().reverse().map((e) => (
                <div key={e.id} className="border-b border-slate-900 pb-1 flex justify-between">
                  <span>{e.summary}</span>
                  <span className={`px-1.5 rounded ${SEVERITY_STYLE[e.severity] || ''}`}>{e.severity}</span>
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

const TABS_BASE = [
  { id: 'monitoring', label: '🖥️ Monitorización', Component: MonitoringPanel },
  { id: 'incidents', label: '🛡️ Incidentes', Component: IncidentsPanel },
  { id: 'simulator', label: '🧪 Simulador', Component: SimulatorPanel },
  { id: 'campaigns', label: '🎓 Campañas', Component: CampaignsPanel },
  { id: 'chat', label: '💬 Chat IA', Component: AIChatPanel },
  { id: 'executive', label: '📊 Ejecutivo', Component: ExecutivePanel },
  { id: 'pyme', label: '🏛️ Ciberseguridad PYME', Component: PymeCybersecurityPanel },
];
const ACTIVE_DEFENSE_TAB = { id: 'active-defense', label: '⚔️ Praxia Active Defense', Component: ActiveDefensePanel };

function App() {
  // La pestaña activa se refleja en la URL (#incidents, #chat...) para poder
  // enlazar directamente a un panel y facilitar pruebas automatizadas.
  const initialTab = window.location.hash.replace('#', '');
  const [tab, setTab] = useState(TABS_BASE.some((t) => t.id === initialTab) ? initialTab : 'monitoring');
  // Praxia Active Defense es un módulo de pago -- la pestaña solo aparece
  // si el cliente lo tiene contratado (settings.PRAXIA_ACTIVE_DEFENSE_ENABLED
  // en el backend). /status es la única ruta del módulo sin gating 403.
  const [activeDefenseEnabled, setActiveDefenseEnabled] = useState(false);
  useEffect(() => {
    fetch('/v1/active-defense/status')
      .then((r) => (r.ok ? r.json() : { enabled: false }))
      .then((d) => setActiveDefenseEnabled(!!d.enabled))
      .catch(() => {});
  }, []);
  const TABS = activeDefenseEnabled ? [...TABS_BASE, ACTIVE_DEFENSE_TAB] : TABS_BASE;
  const selectTab = (id) => {
    setTab(id);
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* noop */ }
  };
  const Active = (TABS.find((t) => t.id === tab) || TABS_BASE[0]).Component;
  return (
    <div className="bg-slate-950 text-slate-100 min-h-screen font-sans">
      <header className="border-b border-slate-800 px-4 sm:px-6 py-4 flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-xl font-bold">🛡️ SIEM Security — SOC virtual</h1>
          <p className="text-xs text-slate-500">MVP</p>
        </div>
        <nav className="flex flex-wrap gap-2">
          {TABS.map((t) => (
            <button key={t.id} onClick={() => selectTab(t.id)}
              className={`text-sm px-3 py-1.5 rounded-lg border whitespace-nowrap ${tab === t.id ? 'bg-blue-600 border-blue-500' : 'border-slate-700 hover:bg-slate-800'}`}>
              {t.label}
            </button>
          ))}
        </nav>
      </header>
      <main className="p-4 sm:p-6">
        <ErrorBoundary key={tab}>
          <Active />
        </ErrorBoundary>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
