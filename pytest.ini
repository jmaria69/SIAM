[pytest]
; Sin esto, `pytest` (invocado directo, no como `python -m pytest`) no
; encuentra el paquete `siem/` (antes `siam/`) porque solo añade a sys.path la carpeta de
; los tests, no la raíz del proyecto. Con `python -m pytest` no hacía falta
; (el propio intérprete añade el cwd), pero no hay que depender de cómo lo
; invoque cada quien.
pythonpath = .
testpaths = tests
